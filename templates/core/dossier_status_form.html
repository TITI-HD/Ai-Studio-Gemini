{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-xl mx-auto py-12">
    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-2xl shadow-slate-200/50 overflow-hidden">
        <div class="bg-slate-900 px-10 py-8">
            <h1 class="text-2xl font-black text-white tracking-widest uppercase">Mise à jour Dossier</h1>
            <p class="text-slate-400 font-bold mt-1 text-xs">IDENTIFIANT #{{ object.id }}</p>
        </div>
        
        <form method="post" class="p-10 space-y-8">
            {% csrf_token %}
            <div class="space-y-6">
                {{ form|crispy }}
            </div>
            
            <div class="pt-6 flex flex-col sm:flex-row gap-4">
                <button type="submit" class="flex-grow bg-blue-600 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-blue-700 transition-all shadow-xl shadow-blue-500/20 active:scale-95">
                    Confirmer le changement
                </button>
                <a href="{% url 'core:dossier_detail' object.id %}" class="px-8 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-200 transition-all text-center">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
