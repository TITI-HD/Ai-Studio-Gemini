{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<div class="max-w-2xl mx-auto py-12">
    <div class="bg-white rounded-[2rem] border border-slate-200 shadow-2xl shadow-slate-200/50 overflow-hidden">
        <div class="bg-blue-600 px-10 py-10">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">Nouvelle Demande</h1>
            <p class="text-blue-100 font-medium mt-2">Soumettez vos informations pour obtenir un acte d'état civil officiel.</p>
        </div>
        
        <form method="post" enctype="multipart/form-data" class="p-10 space-y-8">
            {% csrf_token %}
            <div class="space-y-6">
                {{ form|crispy }}
            </div>
            
            <div class="pt-6 flex flex-col sm:flex-row gap-4">
                <button type="submit" class="flex-grow bg-slate-900 text-white px-8 py-4 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-blue-600 transition-all shadow-xl shadow-slate-900/10 hover:shadow-blue-500/20 active:scale-95">
                    Envoyer le Dossier
                </button>
                <a href="{% url 'core:citizen_dashboard' %}" class="px-8 py-4 bg-slate-100 text-slate-500 rounded-2xl font-black text-xs uppercase tracking-widest hover:bg-slate-200 transition-all text-center">
                    Annuler
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
